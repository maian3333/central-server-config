# KRaft Configuration
node.id=1
process.roles=broker,controller
controller.quorum.voters=1@kafka:29093

# Listeners Configuration
listeners=SASL_SSL://0.0.0.0:9093,PLAINTEXT://0.0.0.0:19092,SSL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
advertised.listeners=SASL_SSL://localhost:9093,PLAINTEXT://kafka:19092,SSL://localhost:9094
listener.security.protocol.map=SASL_SSL:SASL_SSL,PLAINTEXT:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# SSL Configuration for SASL_SSL listener
ssl.keystore.location=/etc/kafka/secrets/kafka.broker.keystore.jks
ssl.keystore.password=f4security
ssl.key.password=f4security
ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.jks
ssl.truststore.password=f4security
ssl.client.auth=none
ssl.endpoint.identification.algorithm=

# SSL Configuration for SSL listener (port 9092) - use original certificates
listener.name.ssl.ssl.keystore.location=/etc/kafka/secrets/kafka.broker.keystore.jks
listener.name.ssl.ssl.keystore.password=f4security
listener.name.ssl.ssl.key.password=f4security
listener.name.ssl.ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.jks
listener.name.ssl.ssl.truststore.password=f4security
listener.name.ssl.ssl.endpoint.identification.algorithm=""

# SASL Configuration
sasl.enabled.mechanisms=OAUTHBEARER

# Strimzi OAuth Configuration for SASL_SSL listener
listener.name.sasl_ssl.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
listener.name.sasl_ssl.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler

# JAAS Configuration for SASL_SSL listener with Strimzi OAuth
listener.name.sasl_ssl.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required \
  oauth.client.id="web_app" \
  oauth.client.secret="0TnpRknqjQYngbnbRW7hKECA8TbR4D7V" \
  oauth.token.endpoint.uri="http://keycloak:9080/realms/jhipster/protocol/openid-connect/token" \
  oauth.valid.issuer.uri="http://keycloak:9080/realms/jhipster" \
  oauth.jwks.endpoint.uri="http://keycloak:9080/realms/jhipster/protocol/openid-connect/certs" \
  oauth.username.claim="preferred_username";

# Storage
log.dirs=/var/lib/kafka/data

# Authorization - Allow all for now
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:kafka;User:ANONYMOUS
allow.everyone.if.no.acl.found=true

# Performance & Stability
num.network.threads=8
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Log Configuration
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Security
connections.max.idle.ms=600000
connection.failed.authentication.delay.ms=1000
